version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20.x
    commands:
      - echo "Installing dependencies..."
      - npm ci --legacy-peer-deps

  build:
    commands:
      - echo "Building the react app..."
      - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: dist
  discard-paths: no
